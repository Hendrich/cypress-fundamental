<html lang="en">
    <head>
        <title>JS Variable</title>
    </head>
    <body>
       
        <p id="use_var"></p>
        <p id="use_let"></p>
        <p id="use_nothing"></p>
        <p id="use_const"></p>
        <!-- <p id="concatenation"></p>
        <p id="coercion"></p>
        <p id="concatenation2"></p> -->

        <script>
           
            // use var
            var x1 = 100;
            var y1 = 200;
            var z1 = x1 + y1;
            document.getElementById("use_var").innerHTML = "this value of z if using var variable is : " + z1;

            // use let
            let x2 = 100;
            let y2 = 200;
            let z2 = x2 + y2;
            document.getElementById("use_let").innerHTML = "this value of z if using let variable is : " + z2;

            // use nothing
            x3 = 100;
            y3 = 200;
            z3 = x3 + y3;
            document.getElementById("use_nothing").innerHTML = "this value of z if using nothing variable is : " + z3;

            // use const
            const x4 = 100;
            const y4 = 200;
            const z4 = x4 + y4;
            document.getElementById('use_const').innerHTML = "this value of z if using const variable is : " + z4;

            // x = '10' + 10 + 10
            // y = 10 + 10 + '10'
            // z = 10 + '10' + 10

            // // '10' + 10 = '1010' + 10 = '101010'
            // document.getElementById('coercion').innerHTML = y;
            // // 10 + 10 = 20 + '10' = '2010'
            // document.getElementById('concatenation2').innerHTML = z;
            // // 10 + '10' = '1010' + 10 = '101010'
        </script>
    </body>
</html>
